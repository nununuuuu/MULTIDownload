name: 🚀 Release + Discord 通知

# 手動觸發發布 (會自動讀取 APP_VERSION 作為 Tag)
on:
  workflow_dispatch:

permissions: write-all

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get APP_VERSION from constants.py
        id: version
        run: |
          $content = Get-Content "constants.py" -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            Write-Host "📌 APP_VERSION: $version"
          } else {
            Write-Error "❌ 無法讀取 APP_VERSION"
            exit 1
          }
        shell: pwsh

      - name: Extract Changelog Section
        id: changelog
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $changelog = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
          # 匹配 ## [版本號] 到下一個 ## [ 或檔案結尾
          $pattern = "(?s)## \[$version\](.*?)(?=\r?\n## \[|$)"
          $match = [regex]::Match($changelog, $pattern)

          if ($match.Success) {
            $content = $match.Groups[1].Value.Trim()
            $content | Out-File -FilePath "release_notes.md" -Encoding UTF8
            Write-Host "✅ Extracted changelog for version $version"
          } else {
            "無詳細更新日誌紀錄。" | Out-File -FilePath "release_notes.md" -Encoding UTF8
            Write-Host "⚠️ No changelog entry found for $version"
          }
        shell: pwsh

      - name: Create and Push Tag
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 獲取遠端標籤以檢查是否存在
          git fetch --tags
          $tagExists = git tag -l $version

          if ($tagExists) {
            Write-Host "ℹ️ 標籤 $version 已存在，將直接使用現有標籤進行發布。"
          } else {
            Write-Host "🚀 建立新標籤: $version"
            git tag $version
            git push origin $version
            Write-Host "✅ 已成功建立並推送新標籤。"
          }
        shell: pwsh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup FFmpeg
        run: |
          New-Item -ItemType Directory -Force -Path bin

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp -Force

          $extractedDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          $binSource = "$($extractedDir.FullName)\bin"

          Move-Item -Path "$binSource\ffmpeg.exe" -Destination bin\
          Move-Item -Path "$binSource\ffprobe.exe" -Destination bin\

      - name: Build Application
        run: python build_onedir.py

      - name: Compress Release ZIP
        run: |
          Compress-Archive -Path dist/MULTIDownload -DestinationPath dist/MULTIDownload.zip -Force
          Write-Host "✅ Created: dist/MULTIDownload.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: dist/MULTIDownload.zip
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Notification
        if: success()
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releaseUrl = "https://github.com/nununuuuu/MULTIDownload/releases/tag/$version"

          # 讀取剛剛生成的 release_notes.md
          $content = Get-Content "release_notes.md" -Raw -Encoding UTF8

          # 將多行內容處理為清單項目，適合於 Discord 顯示
          $lines = $content -split "`r?`n" | Where-Object { $_ -match "^\s*-\s+" }

          if ($lines) {
            # 清理每行：移除粗體標記，並統一列表符號，保留縮進以維持層級感
            $changes = ($lines | ForEach-Object { 
              # 1. 處理列表符號：保留縮進，將 "-" 替換為 "•"
              $line = $_ -replace "^(\s*)-\s*", '$1• '
              # 2. 移除所有 "**" 粗體標記
              $line = $line -replace "\*\*", ""
              # 3. 移除所有 "`" 行內程式碼標記
              $line = $line -replace '`', ""
              # 4. 移除多餘的末尾空格
              $line.TrimEnd()
            }) -join "`n"
            
            # 限制長度 (Discord embed 限制)
            if ($changes.Length -gt 900) {
              $changes = $changes.Substring(0, 900) + "..."
            }
          } else {
            $changes = "請前往 GitHub 查看詳細更新紀錄。"
          }

          $embed = @{
            title = "MULTIDownload v$version Released!"
            description = "New version is now available for download."
            color = 5814783
            fields = @(
              @{
                name = "Version"
                value = "v$version"
                inline = $true
              }
              @{
                name = "Download"
                value = "[GitHub Releases]($releaseUrl)"
                inline = $true
              }
              @{
                name = "Changes"
                value = $changes
                inline = $false
              }
            )
            footer = @{
              text = "MULTIDownload - Auto Release"
            }
            timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }

          $body = @{
            embeds = @($embed)
          } | ConvertTo-Json -Depth 10

          try {
            Invoke-RestMethod -Uri "${{ secrets.DISCORD_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $body
            Write-Host "✅ Discord 通知已發送！"
          } catch {
            Write-Host "⚠️ Discord 通知失敗: $_"
          }
        shell: pwsh
