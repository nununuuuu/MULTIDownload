name: Build Application

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - '*' # 支援所有 Tag 格式 (例如 2025.01.02)
  pull_request:
    branches: [ "main", "master" ]

permissions: write-all

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Setup FFmpeg (Download & Extract)
      run: |
        # 1. 建立 bin 資料夾
        New-Item -ItemType Directory -Force -Path bin
        
        # 2. 下載 FFmpeg (從 GitHub Releases)
        $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        $outputZip = "ffmpeg.zip"
        
        Write-Host "Downloading FFmpeg from $ffmpegUrl ..."
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile $outputZip
        
        # 3. 解壓縮
        Write-Host "Extracting FFmpeg..."
        Expand-Archive -Path $outputZip -DestinationPath ffmpeg_temp -Force
        
        # 4. 移動 exe 到 bin/
        # 結構通常是 ffmpeg_temp/ffmpeg-master.../bin/ffmpeg.exe
        $extractedDir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
        $binSource = "$($extractedDir.FullName)\bin"
        
        Move-Item -Path "$binSource\ffmpeg.exe" -Destination bin\
        Move-Item -Path "$binSource\ffprobe.exe" -Destination bin\
        
        # 驗證
        if (Test-Path "bin\ffmpeg.exe") { Write-Host "FFmpeg setup successfully!" } else { Write-Error "FFmpeg missing!" }
        
    - name: Build Application (Same as Local)
      run: |
        python build_onedir.py
        
    - name: Upload Artifact (Build Result)
      uses: actions/upload-artifact@v4
      with:
        name: MULTIDownload-Build
        path: dist/MULTIDownload
        if-no-files-found: error
        
    # 僅在 Tag 推送時執行發布流程
    - name: Compress Release (Zip)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        powershell Compress-Archive -Path dist/MULTIDownload -DestinationPath dist/MULTIDownload.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/MULTIDownload.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
